<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icons/favicon-32x32.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Signova — ASL to text translation for Deaf and hard-of-hearing service users."
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Signova" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="theme-color" content="#5B2A86" />
    <title>Signova</title>
    <script>
      window.__signovaInstallPrompt = null;
      window.addEventListener("beforeinstallprompt", function (event) {
        event.preventDefault();
        window.__signovaInstallPrompt = event;
        window.dispatchEvent(new Event("signova-install-available"));
      });
    </script>
    <!-- Early theme script to eliminate flash of light mode before JS loads. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("signova-theme");
          var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          var dark = stored ? stored === "dark" : prefersDark;
          if (dark) {
            document.documentElement.setAttribute("data-theme", "dark");
          }
        } catch (e) {
          // localStorage unavailable — fall back to system preference via CSS.
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
