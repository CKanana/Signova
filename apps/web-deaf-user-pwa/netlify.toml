# Signova Deaf-user PWA — Netlify site configuration.
#
# Netlify site settings:
#   Base directory:    (blank) repository root
#   Build command:     npm ci --workspace @signova/web-deaf-user-pwa --include=dev
#                      && npm run build --workspace @signova/web-deaf-user-pwa
#   Publish directory: apps/web-deaf-user-pwa/dist
#
# Required build environment variables (Site configuration → Environment):
#   NODE_VERSION      22.12.0
#   VITE_API_URL      https://api.<SIGNOVA_DOMAIN>
#   VITE_USE_MODEL    true
#
# This app is installed standalone; it is not merged with the teller or
# administrator sites. The install and build are scoped to this workspace so
# the root "build all workspaces" script and the other apps are never run.

[build]
  command = "npm ci --workspace @signova/web-deaf-user-pwa --include=dev && npm run build --workspace @signova/web-deaf-user-pwa"
  publish = "apps/web-deaf-user-pwa/dist"

[build.environment]
  NODE_VERSION = "22.12.0"

# SPA history fallback. Static files (model, wasm, sw.js, manifest) are served
# before this rewrite because Netlify checks the publish directory first.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# The service worker must never be served stale, otherwise a new build can
# remain pinned to an old precache manifest.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/registerSW.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
